<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5F4EE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LumaCare" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/pwa-192.png" />
    <title>LumaCare — Small steps. Better days.</title>
    <script>
      (function () {
        var native = location.protocol === "capacitor:" || location.protocol === "ionic:" || location.hostname === "localhost" || location.hostname.indexOf("lumacare-build-") === 0;
        if (!native || !("serviceWorker" in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
        }).then(function () {
          if (!window.caches) return;
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          });
        });
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        background: #f5f4ee;
      }
      body {
        touch-action: manipulation;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
